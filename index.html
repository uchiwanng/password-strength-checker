<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>密码强度检测 · 本机运行</title>
<style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --line: #e5e7eb;
  --line-strong: #d5d9e0;
  --text: #1f2328;
  --text-soft: #5b6470;
  --text-mute: #8b949e;
  --accent: #2b6cb0;
  --accent-soft: #eaf1fa;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px rgba(16, 24, 40, .06);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 20px 56px;
}

/* ---------- 头部 ---------- */
.head { margin-bottom: 22px; }

.head h1 {
  margin: 0 0 6px;
  font-size: 26px;
  letter-spacing: -.3px;
  font-weight: 650;
}

.head .sub {
  margin: 0;
  color: var(--text-soft);
  font-size: 14px;
}

/* ---------- 卡片 ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 16px;
}

/* ---------- 输入 ---------- */
.field-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  margin-bottom: 8px;
}

.input-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.input-row input {
  flex: 1 1 auto;
  min-width: 0;
  height: 44px;
  padding: 0 14px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  font-size: 16px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--text);
  background: #fff;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}

.input-row input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(43, 108, 176, .12);
}

.btn {
  height: 44px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line-strong);
  background: #fff;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}

.btn:hover { background: #f3f5f8; border-color: #c3c9d2; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:active { transform: translateY(.5px); }

.btn.ghost {
  min-width: 60px;
  color: var(--text-soft);
  background: #fff;
}

/* ---------- 强度条 ---------- */
.meter { margin-top: 18px; }

.meter-track {
  height: 8px;
  background: #edf0f3;
  border-radius: 99px;
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  width: 0;
  border-radius: 99px;
  background: #c9ced6;
  transition: width .22s ease, background-color .22s ease;
}

.meter-meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-top: 10px;
  gap: 12px;
}

.level {
  font-size: 16px;
  font-weight: 650;
  color: var(--text-mute);
}

.score {
  font-size: 13px;
  color: var(--text-mute);
  font-variant-numeric: tabular-nums;
}

.hint {
  margin: 6px 0 0;
  font-size: 13px;
  color: var(--text-soft);
}

/* ---------- 示例 ---------- */
.examples {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px dashed var(--line);
  font-size: 13px;
  color: var(--text-mute);
}

.chip {
  height: 30px;
  padding: 0 12px;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: #fff;
  color: var(--text-soft);
  font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  cursor: pointer;
}

.chip:hover { background: var(--accent-soft); border-color: #b9cee6; color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 高级选项 ---------- */
.advanced {
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-soft);
}

.advanced summary {
  cursor: pointer;
  color: var(--text-mute);
  outline: none;
}

.advanced summary:hover { color: var(--text-soft); }

.adv-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 12px;
}

.adv-grid label {
  display: block;
  font-size: 12.5px;
  color: var(--text-mute);
}

.adv-grid input {
  display: block;
  width: 100%;
  height: 38px;
  margin-top: 4px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  outline: none;
}

.adv-grid input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(43, 108, 176, .12);
}

/* ---------- 结果 ---------- */
.card h2 {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 650;
  color: var(--text-mute);
  letter-spacing: .3px;
}

.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.issues, .suggestions {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 14px;
}

.issues li {
  position: relative;
  padding-left: 18px;
  margin-bottom: 9px;
  color: var(--text);
}

.issues li::before {
  content: "";
  position: absolute;
  left: 0;
  top: .55em;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #b9c0c9;
}

.issues li.sev-3::before { background: #d93025; }
.issues li.sev-2::before { background: #e8710a; }
.issues li.sev-1::before { background: #c99a06; }
.issues li.ok { color: var(--text-soft); }
.issues li.ok::before { background: #1e8e3e; }

.suggestions {
  counter-reset: s;
}

.suggestions li {
  position: relative;
  padding-left: 24px;
  margin-bottom: 9px;
  color: var(--text-soft);
}

.suggestions li::before {
  counter-increment: s;
  content: counter(s);
  position: absolute;
  left: 0;
  top: .05em;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  line-height: 17px;
  text-align: center;
}

/* ---------- 明细 ---------- */
.breakdown {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 13px;
  color: var(--text-soft);
}

.breakdown summary {
  cursor: pointer;
  color: var(--text-mute);
  outline: none;
}

.breakdown table {
  width: 100%;
  margin-top: 12px;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

.breakdown td {
  padding: 6px 0;
  border-bottom: 1px dashed var(--line);
}

.breakdown td:first-child { color: var(--text-soft); }
.breakdown td:last-child { text-align: right; font-family: ui-monospace, Menlo, Consolas, monospace; }

.breakdown tr:last-child td { border-bottom: none; }

.breakdown .neg { color: #d93025; }

.note {
  margin: 10px 0 0;
  font-size: 12.5px;
  color: var(--text-mute);
}

.actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
}

.copied { font-size: 13px; color: #1e8e3e; }

/* ---------- 页脚 ---------- */
.foot {
  margin-top: 24px;
  font-size: 12.5px;
  color: var(--text-mute);
  line-height: 1.7;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 620px) {
  .wrap { padding: 26px 14px 40px; }
  .cols { grid-template-columns: 1fr; gap: 18px; }
  .adv-grid { grid-template-columns: 1fr; }
  .head h1 { font-size: 22px; }
  .btn.ghost { min-width: 52px; padding: 0 12px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <h1>密码强度检测</h1>
    <p class="sub">输入即评分 · 完全在本机运行 · 不上传、不存储、不留痕</p>
  </header>

  <section class="card">
    <label class="field-label" for="pwd">密码</label>
    <div class="input-row">
      <input id="pwd" type="password" autocomplete="new-password" spellcheck="false"
             autocapitalize="off" autocorrect="off"
             placeholder="在这里输入要检测的密码" aria-describedby="meter-hint">
      <button id="toggle" class="btn ghost" type="button" aria-pressed="false">显示</button>
      <button id="clear" class="btn ghost" type="button">清空</button>
    </div>

    <div class="meter">
      <div class="meter-track" id="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="密码强度评分">
        <div class="meter-fill" id="fill"></div>
      </div>
      <div class="meter-meta">
        <span class="level" id="level">等待输入</span>
        <span class="score" id="score">— / 100</span>
      </div>
      <p class="hint" id="meter-hint">建议使用 12 位以上、混合多种字符的密码</p>
    </div>

    <div class="examples">
      <span>试试：</span>
      <button class="chip" type="button" data-pwd="123456">123456</button>
      <button class="chip" type="button" data-pwd="P@ssw0rd">P@ssw0rd</button>
      <button class="chip" type="button" data-pwd="correct horse battery staple">correct horse battery staple</button>
    </div>

    <details class="advanced">
      <summary>高级选项（可选）</summary>
      <div class="adv-grid">
        <label>用户名
          <input id="username" type="text" autocomplete="off" spellcheck="false" placeholder="检测密码是否包含账号名">
        </label>
        <label>邮箱
          <input id="email" type="email" autocomplete="off" spellcheck="false" placeholder="可选">
        </label>
      </div>
    </details>
  </section>

  <section class="card" id="result" hidden>
    <div class="cols">
      <div>
        <h2>问题诊断</h2>
        <ul class="issues" id="issues"></ul>
      </div>
      <div>
        <h2>改进建议</h2>
        <ol class="suggestions" id="suggestions"></ol>
      </div>
    </div>

    <details class="breakdown">
      <summary>评分明细</summary>
      <table>
        <tbody id="breakdown"></tbody>
      </table>
      <p class="note" id="entropy-note"></p>
    </details>

    <div class="actions">
      <button class="btn" id="copy" type="button">复制检测结果</button>
      <span class="copied" id="copied" hidden>已复制</span>
    </div>
  </section>

  <footer class="foot">
    本工具仅评估口令本身的强度，不能防止钓鱼、撞库与设备被控。所有计算都在浏览器内存中完成，
    页面不发起任何网络请求，也不会把密码写入本地存储或日志。
  </footer>

</div>

/**
 * detector.js — 核心算法层（纯函数，不接触 DOM）
 * detect(password, options) -> 结果对象，见 README「接口」一节
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory(require('./rules.js'));
  } else {
    root.PWD_DETECTOR = factory(root.PWD_RULES);
  }
})(typeof self !== 'undefined' ? self : this, function (RULES) {
  'use strict';

  var MAX_LEN = RULES.MAX_LEN;

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function levelOf(score) {
    for (var i = 0; i < RULES.LEVELS.length; i++) {
      if (score >= RULES.LEVELS[i].min) return RULES.LEVELS[i];
    }
    return RULES.LEVELS[RULES.LEVELS.length - 1];
  }

  /** 字符类别 */
  function classify(ch) {
    var cp = ch.codePointAt(0);
    if (ch >= 'a' && ch <= 'z') return 'lower';
    if (ch >= 'A' && ch <= 'Z') return 'upper';
    if (ch >= '0' && ch <= '9') return 'digit';
    if (cp > 127) return 'other';
    return 'symbol';
  }

  /** 骨架串：小写 + leetspeak 还原，用于字典与相似度比较 */
  function skeleton(str, oneAs) {
    var out = '';
    for (var i = 0; i < str.length; i++) {
      var ch = str.charAt(i);
      var low = ch.toLowerCase();
      if (low === '1' && oneAs) {
        out += oneAs;
      } else if (RULES.LEET[low]) {
        out += RULES.LEET[low];
      } else {
        out += low;
      }
    }
    return out;
  }

  /** 精确查字典 */
  function lookupExact(sk) {
    if (!sk || sk.length < 3) return null;
    var idx = RULES.WEAK_INDEX.get(sk);
    if (idx === undefined) return null;
    return { word: sk, index: idx, exact: true };
  }

  /**
   * 字典查询：先精确命中；再剥离结尾 1~4 位数字/符号后命中，
   * 用于识别 password123 / admin2026 一类"词 + 后缀"的变形。
   * 只剥离数字和符号——剥字母会把 aaaaaa 之类的重复串误判成字典词。
   */
  function lookupDict(lower, skFn) {
    var hit = lookupExact(skFn(lower));
    if (hit) return hit;
    for (var cut = 1; cut <= 4; cut++) {
      var idx = lower.length - cut;
      if (idx < 3) break;
      var ch = lower.charAt(idx);
      if (!/[0-9\W_]/.test(ch)) break;
      var base = lower.slice(0, idx);
      var h = lookupExact(skFn(base));
      if (h) return { word: h.word, index: h.index, exact: false };
    }
    return null;
  }

  /** 连续重复：同字符连续 >= 3，或整串按周期重复 */
  function detectRepeat(chars) {
    var run = 1;
    var maxRun = { ch: chars[0], n: 1 };
    for (var i = 1; i < chars.length; i++) {
      if (chars[i] === chars[i - 1]) {
        run++;
        if (run > maxRun.n) maxRun = { ch: chars[i], n: run };
      } else {
        run = 1;
      }
    }
    if (maxRun.n >= 3) {
      return { type: 'run', char: maxRun.ch, count: maxRun.n };
    }
    var len = chars.length;
    if (len >= 6) {
      for (var p = 1; p <= len / 2; p++) {
        if (len % p !== 0) continue;
        var ok = true;
        for (var j = p; j < len; j++) {
          if (chars[j] !== chars[j - p]) { ok = false; break; }
        }
        if (ok) {
          return { type: 'period', unit: chars.slice(0, p).join(''), times: len / p };
        }
      }
    }
    return null;
  }

  /** 键盘序列（含反向），min 位起 */
  function detectKeyboard(lower, min) {
    for (var r = 0; r < RULES.KEYBOARD_ROWS.length; r++) {
      var row = RULES.KEYBOARD_ROWS[r];
      var rev = row.split('').reverse().join('');
      var variants = [row, rev];
      for (var v = 0; v < variants.length; v++) {
        var s = variants[v];
        for (var i = 0; i + min <= s.length; i++) {
          var seg = s.slice(i, i + min);
          if (lower.indexOf(seg) !== -1) return seg;
        }
      }
    }
    return null;
  }

  /** 连续递增/递减（相邻码点差恒为 ±1），返回命中的片段 */
  function detectSequence(chars, min) {
    var dir = 0;
    var start = 0;
    for (var i = 1; i < chars.length; i++) {
      var d = chars[i].codePointAt(0) - chars[i - 1].codePointAt(0);
      if (d === 1 || d === -1) {
        if (dir !== d) {
          dir = d;
          start = i - 1;
        }
        if (i - start + 1 >= min) {
          return chars.slice(start, i + 1).join('');
        }
      } else {
        dir = 0;
        start = i;
      }
    }
    return null;
  }

  /** 日期 / 年份 */
  function detectDate(pwd) {
    var m = pwd.match(/(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])/);
    if (m) return m[0];
    m = pwd.match(/(?:0[1-9]|[12]\d|3[01])(?:0[1-9]|1[0-2])(?:19|20)\d{2}/);
    if (m) return m[0];
    m = pwd.match(/(?:19|20)\d{2}/);
    if (m) return m[0];
    return null;
  }

  /** Levenshtein 距离（超长输入截断，保证性能） */
  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    a = a.slice(0, 40);
    b = b.slice(0, 40);
    var prev = [];
    var i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      var cur = [i];
      for (j = 1; j <= b.length; j++) {
        var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
      }
      prev = cur;
    }
    return prev[b.length];
  }

  function emptyResult(truncated) {
    return {
      score: 0,
      level: null,
      levelLabel: '',
      entropy: 0,
      length: 0,
      charsetCount: 0,
      pool: 0,
      unique: 0,
      transitions: 0,
      truncated: !!truncated,
      breakdown: { length: 0, diversity: 0, structure: 0, entropyBonus: 0, penalty: 0 },
      issues: [],
      suggestions: [],
      weakWord: null,
      vetoed: false
    };
  }

  function detect(password, options) {
    options = options || {};
    var raw = typeof password === 'string' ? password : '';
    var truncated = raw.length > MAX_LEN;
    var pwd = truncated ? raw.slice(0, MAX_LEN) : raw;
    var chars = Array.from(pwd);
    var len = chars.length;
    if (len === 0) return emptyResult(truncated);

    var W = RULES.WEIGHTS;
    var P = RULES.PENALTIES;

    /* ---------- 步骤 1/2：字符集分析 ---------- */
    var counts = { lower: 0, upper: 0, digit: 0, symbol: 0, other: 0 };
    var classes = [];
    for (var i = 0; i < len; i++) {
      var cls = classify(chars[i]);
      counts[cls]++;
      classes.push(cls);
    }
    var charsetCount = 0;
    ['lower', 'upper', 'digit', 'symbol', 'other'].forEach(function (k) {
      if (counts[k] > 0) charsetCount++;
    });

    var transitions = 0;
    for (var t = 1; t < classes.length; t++) {
      if (classes[t] !== classes[t - 1]) transitions++;
    }

    var unique = new Set(chars).size;
    var pool = 26 * (counts.lower ? 1 : 0) + 26 * (counts.upper ? 1 : 0) +
      10 * (counts.digit ? 1 : 0) + 32 * (counts.symbol ? 1 : 0) +
      100 * (counts.other ? 1 : 0);
    if (pool < 1) pool = 1;

    /* ---------- 步骤 3：字典匹配 ---------- */
    var lower = pwd.toLowerCase();
    var skL = function (s) { return skeleton(s, 'l'); };
    var dict = lookupDict(lower, skL);
    if (!dict) dict = lookupDict(lower, function (s) { return skeleton(s, 'i'); });
    var sk = skL(pwd);
    var vetoed = !!(dict && dict.index < RULES.HIGH_RISK_COUNT);

    /* ---------- 步骤 4：模式检测 ---------- */
    var issues = [];

    if (dict) {
      issues.push({
        code: 'dictionary',
        severity: 3,
        penalty: P.dictionary,
        detail: dict.word,
        message: '命中了常见弱口令「' + dict.word + '」' +
          (dict.exact ? '' : '（去掉结尾的数字或符号后命中）'),
        suggestion: '「' + dict.word + '」在公开泄露字典里排在最前面，加数字或符号的变形同样会被优先尝试，建议换成与它完全无关的组合'
      });
    }

    var rep = detectRepeat(chars);
    if (rep) {
      issues.push({
        code: 'repeat',
        severity: 2,
        penalty: P.repeat,
        detail: rep.type === 'run' ? rep.char + ' × ' + rep.count : rep.unit + ' × ' + rep.times,
        message: rep.type === 'run'
          ? '存在 ' + rep.count + ' 个连续重复的「' + rep.char + '」，重复不增加安全性'
          : '整串由「' + rep.unit + '」重复 ' + rep.times + ' 次构成，实际信息量只有 ' + rep.unit.length + ' 位',
        suggestion: rep.type === 'run'
          ? '连续重复的字符几乎不增加破解难度，把它们换成不相关的字符'
          : '「' + rep.unit + '」的重复等于把长度优势作废，建议整段重写'
      });
    }

    var kb = detectKeyboard(lower, 4);
    if (kb) {
      issues.push({
        code: 'keyboard',
        severity: 2,
        penalty: P.keyboard,
        detail: kb,
        message: '包含键盘上相邻的按键序列「' + kb + '」，是攻击者优先尝试的组合',
        suggestion: '键盘上挨着的按键（如 ' + kb + '）在字典攻击里出现率极高，尽量避开'
      });
    }

    var seq = kb ? null : detectSequence(chars, 4);
    if (seq) {
      issues.push({
        code: 'sequence',
        severity: 1,
        penalty: P.sequence,
        detail: seq,
        message: '包含连续递增或递减的片段「' + seq + '」',
        suggestion: '「' + seq + '」属于可预测序列，打乱顺序比继续加长更有效'
      });
    }

    var date = detectDate(pwd);
    if (date) {
      issues.push({
        code: 'date',
        severity: 1,
        penalty: P.date,
        detail: date,
        message: '包含疑似年份或日期「' + date + '」，生日与年份是最早被尝试的范围',
        suggestion: '把「' + date + '」这类年份换成与个人信息无关的字符'
      });
    }

    if (counts.digit === len) {
      issues.push({
        code: 'allDigits',
        severity: 3,
        penalty: P.allDigits,
        detail: String(len),
        message: '整串只有数字，搜索空间仅 10^' + len,
        suggestion: '纯数字即使很长也扛不住穷举，至少混入字母与符号'
      });
    } else if ((counts.lower + counts.upper) === len && len < 12) {
      issues.push({
        code: 'allLetters',
        severity: 1,
        penalty: P.allLetters,
        detail: String(len),
        message: '整串只有字母且长度不足 12 位',
        suggestion: '加入数字或符号能把可能的字符池扩大数倍'
      });
    }

    var uname = String(options.username || '').trim().toLowerCase();
    var email = String(options.email || '').trim().toLowerCase();
    var identity = uname.length >= 3 ? uname : (email.length >= 3 ? email.split('@')[0] : '');
    if (identity.length >= 3) {
      var idSk = skeleton(identity, 'l');
      var similar = false;
      if (sk.indexOf(idSk) !== -1 || (sk.length >= 3 && idSk.indexOf(sk) !== -1)) {
        similar = true;
      } else if (Math.abs(sk.length - idSk.length) <= 2 && levenshtein(sk, idSk) <= 2) {
        similar = true;
      }
      if (similar) {
        issues.push({
          code: 'similar',
          severity: 3,
          penalty: P.similar,
          detail: identity,
          message: '与用户名 / 邮箱「' + identity + '」高度相似',
          suggestion: '把账号名放进密码里，等于让攻击者省掉一半工作，建议完全避开'
        });
      }
    }

    /* ---------- 步骤 5：熵 ---------- */
    var entropy = len * Math.log2(pool);
    if (unique / len < 0.5) entropy *= 0.6;

    /* ---------- 步骤 6：评分 ---------- */
    var lengthScore = Math.min(len, W.lengthCap) * W.lengthFactor;
    var diversityScore = charsetCount * W.diversityFactor;
    var structureScore = transitions >= W.structureFastThreshold
      ? W.structureCap
      : Math.min(transitions * W.structureStep, W.structureCap);
    var entropyBonus = clamp((entropy - W.entropyBase) / W.entropyDivisor, 0, W.entropyBonusCap);

    var penalty = 0;
    for (var k = 0; k < issues.length; k++) penalty += issues[k].penalty;
    penalty = clamp(penalty, P.floor, 0);

    var base = lengthScore + diversityScore + structureScore + entropyBonus;
    var score = clamp(base + penalty, 0, 100);
    if (vetoed) score = Math.min(score, RULES.VETO_CAP);
    score = Math.round(score);

    var level = levelOf(score);

    /* ---------- 步骤 7：建议 ---------- */
    var suggestions = issues.slice().sort(function (a, b) {
      return a.penalty - b.penalty;
    }).slice(0, 3).map(function (it) { return it.suggestion; });

    if (len < 12) {
      var need = 12 - len;
      suggestions.unshift('再增加 ' + need + ' 位长度（到 12 位），这是最划算的提升方式');
    }
    suggestions = suggestions.slice(0, 3);
    if (!suggestions.length) {
      suggestions.push('强度已经足够，注意不要在多处复用，建议配合密码管理器');
    }

    return {
      score: score,
      level: level.key,
      levelLabel: level.label,
      levelColor: level.color,
      levelHint: level.hint,
      entropy: Math.round(entropy * 10) / 10,
      length: len,
      charsetCount: charsetCount,
      pool: pool,
      unique: unique,
      transitions: transitions,
      truncated: truncated,
      breakdown: {
        length: Math.round(lengthScore * 10) / 10,
        diversity: diversityScore,
        structure: structureScore,
        entropyBonus: Math.round(entropyBonus * 10) / 10,
        penalty: penalty
      },
      issues: issues,
      suggestions: suggestions,
      weakWord: dict ? dict.word : null,
      vetoed: vetoed
    };
  }

  return {
    detect: detect,
    _internals: {
      classify: classify,
      skeleton: skeleton,
      lookupDict: lookupDict,
      detectRepeat: detectRepeat,
      detectKeyboard: detectKeyboard,
      detectSequence: detectSequence,
      detectDate: detectDate,
      levenshtein: levenshtein,
      levelOf: levelOf
    }
  };
});

</script>
<script>
/**
 * app.js — 控制层：状态、渲染、可访问性
 * 只消费 PWD_DETECTOR.detect() 的返回值，不包含任何评分逻辑
 */
(function () {
  'use strict';

  var D = window.PWD_DETECTOR;
  if (!D) return;

  var $ = function (id) { return document.getElementById(id); };

  var els = {
    pwd: $('pwd'),
    toggle: $('toggle'),
    clear: $('clear'),
    fill: $('fill'),
    level: $('level'),
    score: $('score'),
    hint: $('meter-hint'),
    result: $('result'),
    issues: $('issues'),
    suggestions: $('suggestions'),
    breakdown: $('breakdown'),
    entropyNote: $('entropy-note'),
    copy: $('copy'),
    copied: $('copied'),
    live: $('live'),
    username: $('username'),
    email: $('email')
  };

  var lastResult = null;
  var lastLevel = null;
  var timer = null;

  function resetMeter() {
    els.fill.style.width = '0%';
    els.fill.style.backgroundColor = '#c9ced6';
    els.level.textContent = '等待输入';
    els.level.style.color = 'var(--text-mute)';
    els.score.textContent = '— / 100';
    els.hint.textContent = '建议使用 12 位以上、混合多种字符的密码';
    els.result.hidden = true;
    lastResult = null;
    var bar = document.getElementById('meter');
    if (bar) bar.setAttribute('aria-valuenow', '0');
  }

  function renderMeter(r) {
    els.fill.style.width = r.score + '%';
    els.fill.style.backgroundColor = r.levelColor;
    els.level.textContent = r.levelLabel;
    els.level.style.color = r.levelColor;
    els.score.textContent = r.score + ' / 100';
    els.hint.textContent = r.levelHint;
    var bar = document.getElementById('meter');
    if (bar) bar.setAttribute('aria-valuenow', String(r.score));
  }

  function renderIssues(r) {
    els.issues.innerHTML = '';
    if (!r.issues.length) {
      var ok = document.createElement('li');
      ok.className = 'ok';
      ok.textContent = '未发现明显问题';
      els.issues.appendChild(ok);
      return;
    }
    r.issues.forEach(function (it) {
      var li = document.createElement('li');
      li.className = 'sev-' + it.severity;
      li.textContent = it.message;
      els.issues.appendChild(li);
    });
  }

  function renderSuggestions(r) {
    els.suggestions.innerHTML = '';
    r.suggestions.forEach(function (s) {
      var li = document.createElement('li');
      li.textContent = s;
      els.suggestions.appendChild(li);
    });
  }

  function cell(tr, text, cls) {
    var td = document.createElement('td');
    td.textContent = text;
    if (cls) td.className = cls;
    tr.appendChild(td);
  }

  function renderBreakdown(r) {
    var b = r.breakdown;
    els.breakdown.innerHTML = '';
    var rows = [
      ['长度分（' + r.length + ' 位，上限 20 位）', '+' + b.length],
      ['多样性分（' + r.charsetCount + ' 类字符）', '+' + b.diversity],
      ['结构分散分（' + r.transitions + ' 次类别切换）', '+' + b.structure],
      ['熵加成（H = ' + r.entropy + ' bit）', '+' + b.entropyBonus],
      ['模式与字典扣分', (b.penalty === 0 ? '0' : String(b.penalty))]
    ];
    rows.forEach(function (row, i) {
      var tr = document.createElement('tr');
      cell(tr, row[0]);
      cell(tr, row[1], i === rows.length - 1 && b.penalty < 0 ? 'neg' : '');
      els.breakdown.appendChild(tr);
    });

    var note = '字符池 ' + r.pool + ' 种 · 去重字符 ' + r.unique + ' 个 · 熵约 ' +
      r.entropy + ' bit（每增加 1 bit，攻击者的尝试次数翻一倍）';
    if (r.vetoed) {
      note += ' · 命中高危弱口令，已锁定为极弱';
    }
    if (r.truncated) {
      note += ' · 输入超过 128 位，仅检测前 128 位';
    }
    els.entropyNote.textContent = note;
  }

  function render() {
    var pwd = els.pwd.value;
    if (!pwd) {
      resetMeter();
      if (lastLevel !== null) {
        els.live.textContent = '已清空';
        lastLevel = null;
      }
      return;
    }

    var r = D.detect(pwd, {
      username: els.username.value,
      email: els.email.value
    });

    lastResult = r;
    renderMeter(r);
    renderIssues(r);
    renderSuggestions(r);
    renderBreakdown(r);
    els.result.hidden = false;

    if (r.level !== lastLevel) {
      els.live.textContent = '强度：' + r.levelLabel + '，评分 ' + r.score + ' 分';
      lastLevel = r.level;
    }
  }

  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(render, 80);
  }

  function setPwd(value) {
    els.pwd.value = value;
    render();
  }

  /* ---------- 事件 ---------- */
  els.pwd.addEventListener('input', schedule);
  els.username.addEventListener('input', schedule);
  els.email.addEventListener('input', schedule);

  els.toggle.addEventListener('click', function () {
    var show = els.pwd.type === 'password';
    els.pwd.type = show ? 'text' : 'password';
    els.toggle.textContent = show ? '隐藏' : '显示';
    els.toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
  });

  els.clear.addEventListener('click', function () {
    els.pwd.value = '';
    els.username.value = '';
    els.email.value = '';
    els.pwd.type = 'password';
    els.toggle.textContent = '显示';
    els.toggle.setAttribute('aria-pressed', 'false');
    els.pwd.focus();
    render();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (btn) {
    btn.addEventListener('click', function () {
      setPwd(btn.getAttribute('data-pwd'));
      els.pwd.focus();
    });
  });

  els.copy.addEventListener('click', function () {
    if (!lastResult) return;
    var r = lastResult;
    var lines = [
      '密码强度：' + r.levelLabel + '（' + r.score + '/100）',
      '长度：' + r.length + ' 位 · 字符类别：' + r.charsetCount + ' 类 · 熵：' + r.entropy + ' bit',
      '问题：' + (r.issues.length ? r.issues.map(function (i) { return i.message; }).join('；') : '未发现明显问题'),
      '建议：' + r.suggestions.join('；')
    ];
    var text = lines.join('\n');
    els.copied.hidden = true;

    function done() {
      els.copied.hidden = false;
      setTimeout(function () { els.copied.hidden = true; }, 1600);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {});
    }
    els.live.textContent = '检测结果已复制，内容不含密码本身';
  });

  resetMeter();
})();

</script>
</body>
</html>
